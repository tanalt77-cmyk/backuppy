# backuppy configuration — v3.0 universal model
#
# A model has three layers:
#   triggers   - things that PRODUCE files (optional; e.g. run BACKUP DATABASE)
#   sources    - WHERE to pick up files (required)
#   destinations - WHERE to send them (local, webdav, s3, ...)
#
# At minimum you need: name + sources + at least one destination.
# Triggers are optional — if files already exist on disk, just use sources.
#
# Documentation: https://github.com/tanalt77-cmyk/backuppy

name: myserver

# ============================================================================
# TRIGGERS (optional list)
# ============================================================================
# Each trigger writes files somewhere on disk. Sources pick them up.
# A trigger does NOT know where they'll be uploaded. A source does NOT know
# who put the files there.

triggers: []
#
# Example: run MSSQL BACKUP DATABASE on a remote Windows server
# - type: mssql
#   host: "10.0.0.5"
#   username: "backup_user"
#   password: "SECRET"
#   output_dir_windows: "D:\\Backups\\archive_sql\\local"
#   databases:
#     - { name: AppDB, backup_type: FULL }
#     - { name: OtherDB, backup_type: DIFFERENTIAL }
#   compression: true
#   checksum: true
#
# Example: dump PostgreSQL locally
# - type: postgres
#   host: localhost
#   username: postgres
#   output_dir: /tmp/backuppy-staging
#   databases: [appdb]
#
# Example: run any shell command (rsync, custom dump scripts, ...)
# - type: hook
#   command: "rsync -av server:/data /tmp/staging/"
#   timeout: 3600

# ============================================================================
# SOURCES (required list)
# ============================================================================
# Where backuppy picks up files for processing. Paths may include glob
# patterns (*.bak, **/*.log). Any path that's reachable from this Linux box
# works — local folders, SMB mounts, NFS mounts, sshfs, anything.

sources:
  - type: files
    paths:
      - /etc
      - /var/www
    excludes:
      - "*/node_modules/*"
      - "*.tmp"
    # archive_name: files          # pack all matched into one tar (recommended)
    # delete_after_pickup: false   # delete source files after copy

# ============================================================================
# PROCESSING (between sources and destinations)
# ============================================================================

compression:
  method: gzip                     # gzip | bzip2 | xz | zstd | none
  level: null                      # null = default

encryption:
  enabled: false
  method: gpg-symmetric            # gpg-symmetric | gpg-asymmetric | openssl
  passphrase_file: /etc/backuppy/passphrase
  # recipient: "backup@example.com"  # for gpg-asymmetric
  # openssl_pass_file: /etc/backuppy/openssl-pass

splitter:
  enabled: false
  chunk_size_mb: 1024
  only_above_mb: 5000

throttle:
  enabled: false
  upload_rate_kbps: 0              # 0 = unlimited

verify:
  enabled: true
  method: size                     # size | checksum

hooks:
  before: []
  after: []
  on_success: []
  on_failure: []

# ============================================================================
# DESTINATIONS
# ============================================================================

local:
  enabled: true
  path: /var/backups/backuppy
  keep_last: 5

webdav:
  enabled: false
  base_url: "https://nextcloud.example.com/remote.php/dav/files/USER/"
  remote_path: "Backups/myserver"
  username: "USER"
  password: "APP-PASSWORD"
  keep_last: 14

s3:
  enabled: false
  bucket: "my-backups-bucket"
  region: "eu-central-1"
  prefix: "myserver"
  access_key_id: ""
  secret_access_key: ""
  # endpoint_url: "https://s3.eu-central-003.backblazeb2.com"   # for B2/MinIO
  storage_class: STANDARD_IA
  server_side_encryption: AES256
  keep_last: 30

sftp:
  enabled: false
  host: backup.example.com
  port: 22
  username: backup
  key_file: /root/.ssh/id_ed25519
  remote_path: "backups/myserver"
  keep_last: 10

dropbox:
  enabled: false
  access_token: ""
  remote_path: "/Backups/myserver"
  keep_last: 30

gcs:
  enabled: false
  bucket: "my-gcs-bucket"
  prefix: "myserver"
  credentials_file: /etc/backuppy/gcs-sa.json
  keep_last: 30

azure:
  enabled: false
  account_name: "mystorageacct"
  account_key: ""
  container: "backups"
  prefix: "myserver"
  keep_last: 30

# ============================================================================
# NOTIFIERS
# ============================================================================

email:
  enabled: false
  when: on_failure                 # always | on_failure
  smtp_host: smtp.example.com
  smtp_port: 587
  smtp_user: backups@example.com
  smtp_password: ""
  from_addr: backups@example.com
  to_addrs:
    - admin@example.com

telegram:
  enabled: false
  when: on_failure
  bot_token: "123456:ABC-DEF..."
  chat_id: "-100123456789"

# ============================================================================
# LOGGING
# ============================================================================

log:
  file: /var/log/backuppy.log
  max_bytes: 5242880               # 5 MB
  backup_count: 5
  level: INFO
