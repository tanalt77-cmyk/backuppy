extends:
  - shared/storage.yml

name: files-www

sources:
  - type: files
    paths: [/var/www, /etc/nginx]
    excludes: ["*/node_modules/*"]
    archive_name: www

compression:
  method: xz
  level: 6

local:
  enabled: true
  path: /var/backups/backuppy/files-www
  keep_last: 5

webdav:
  remote_path: "Backups/files-www"
