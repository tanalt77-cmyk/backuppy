# Model: postgres-app
# PostgreSQL application database, dumped to S3 with own prefix and rotation.

extends:
  - shared/storage.yml
  - shared/notify.yml

name: postgres-app

postgres:
  enabled: true
  host: localhost
  username: postgres
  databases: [app_production]

compression:
  method: zstd
  level: 10

local:
  path: /var/backups/postgres
  keep_last: 7

# Override the shared S3 keep_last and prefix:
s3:
  prefix: postgres-app
  keep_last: 14
