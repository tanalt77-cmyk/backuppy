# Shared destination credentials.
# Referenced from other models via `extends: shared/storage.yml`.

webdav:
  enabled: true
  base_url: "https://nextcloud.example.com/remote.php/dav/files/USER/"
  username: "USER"
  password: "APP-PASSWORD"
  keep_last: 30

log:
  file: /var/log/backuppy.log
  level: INFO

verify:
  enabled: true
  method: size
