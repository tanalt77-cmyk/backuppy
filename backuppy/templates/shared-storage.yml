# Shared storage credentials & policy.
# Other models include this via `extends: shared/storage.yml`.
# Generated by `backuppy new shared/storage --template shared-storage`

# TODO: pick ONE primary remote destination and fill in credentials.
# You can keep multiple destinations enabled if you want copies in several places.

# --- Hetzner Storage Share / Nextcloud (WebDAV) ---
# webdav:
#   enabled: true
#   base_url: "https://uXXXXXX.your-storageshare.de/remote.php/dav/files/uXXXXXX/"
#   remote_path: "Backups"
#   username: "uXXXXXX"
#   password: "APP-PASSWORD"          # generate in Hetzner web UI → Security
#   keep_last: 30

# --- Amazon S3 or S3-compatible (Wasabi, Backblaze B2, MinIO) ---
# s3:
#   enabled: true
#   bucket: my-backups
#   region: eu-central-1
#   access_key_id: "AKIA..."
#   secret_access_key: "..."
#   # endpoint_url: "https://s3.eu-central-003.backblazeb2.com"   # for B2/MinIO
#   storage_class: STANDARD_IA
#   keep_last: 30

# --- SFTP ---
# sftp:
#   enabled: true
#   host: backup.example.com
#   username: backup
#   key_file: /root/.ssh/id_ed25519
#   remote_path: "backups"
#   keep_last: 30

# --- Common settings inherited by every model ---
log:
  file: /var/log/backuppy.log
  level: INFO

verify:
  enabled: true
  method: size
