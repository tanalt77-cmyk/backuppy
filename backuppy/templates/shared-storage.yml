# Shared storage credentials & policy.
# Other models reference this via `extends: shared/storage.yml`.

# Pick ONE primary destination and fill in credentials.
# You can keep multiple destinations enabled for redundancy.

# --- Nextcloud / Hetzner Storage Share (WebDAV) ---
# webdav:
#   enabled: true
#   base_url: "https://cloud.example.com/remote.php/dav/files/USER/"
#   remote_path: "Backups"
#   username: "USER"
#   password: "APP-PASSWORD"
#   keep_last: 30

# --- Amazon S3 or S3-compatible (Wasabi, Backblaze B2, MinIO) ---
# s3:
#   enabled: true
#   bucket: my-backups
#   region: eu-central-1
#   access_key_id: ""
#   secret_access_key: ""
#   # endpoint_url: "https://s3.eu-central-003.backblazeb2.com"
#   storage_class: STANDARD_IA
#   keep_last: 30

# --- SFTP ---
# sftp:
#   enabled: true
#   host: backup.example.com
#   username: backup
#   key_file: /root/.ssh/id_ed25519
#   remote_path: "backups"
#   keep_last: 30

log:
  file: /var/log/backuppy.log
  level: INFO

verify:
  enabled: true
  method: size
