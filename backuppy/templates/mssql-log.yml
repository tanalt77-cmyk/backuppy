# Model: {{NAME}}
# MSSQL TRANSACTION LOG backup — small, fast, captures all changes
# since the previous LOG backup (or FULL if no LOG exists yet).
#
# IMPORTANT: requires recovery_model = FULL or BULK_LOGGED on the database.
# Check current: SELECT name, recovery_model_desc FROM sys.databases;
# Change if needed: ALTER DATABASE [DBName] SET RECOVERY FULL;
#
# Pair with mssql-full (daily) and optionally mssql-diff (e.g. midday).
# Typical schedule: FULL daily, DIFF every 6h, LOG every hour.
#
# Generated by `backuppy new {{NAME}} --template mssql-log`

name: {{NAME}}

triggers:
  - type: mssql
    host: "WINDOWS-HOST"
    port: 1433
    username: "backup_user"
    password: "CHANGE-ME"
    output_dir_windows: "D:\\Backups\\backuppy"
    databases:
      - { name: AppDB, backup_type: LOG }
    compression: true
    checksum: true

sources:
  - type: files
    paths:
      - "/mnt/win-server1/backuppy/*-log-*.trn"
    delete_after_pickup: false

compression:
  method: none                                     # MSSQL already compressed

local:
  enabled: false                                   # LOG files small, skip local stage

# Uncomment a destination for LOG backups — typically same as FULL but
# with higher keep_last (24 for hourly logs = 1 day of point-in-time recovery).
#
# webdav:
#   enabled: true
#   base_url: "https://nextcloud.example.com/remote.php/dav/files/USER/"
#   remote_path: "Backups/{{NAME}}"
#   username: "USER"
#   password: "APP-PASSWORD"
#   keep_last: 24                                  # 24 hourly logs
#   chunked: true
#   chunked_threshold_mb: 500                      # LOG files usually < 500MB

verify:
  enabled: true
  method: size

log:
  file: /var/log/backuppy.log
  level: INFO
