# Model: {{NAME}}
# PostgreSQL backup using pg_dump.
# Generated by `backuppy new {{NAME}} --template postgres`

name: {{NAME}}

triggers:
  - type: postgres
    host: localhost
    port: 5432
    username: postgres
    password: ""                         # or use ~/.pgpass / PGPASSWORD env
    output_dir: /tmp/backuppy-{{NAME}}   # where pg_dump writes
    databases: []                        # [] = pg_dumpall (whole cluster)
    # databases: [appdb, otherdb]
    format: custom                       # custom | plain | tar | directory

sources:
  - type: files
    paths:
      - "/tmp/backuppy-{{NAME}}/*"
    delete_after_pickup: true            # remove after upload — staging only

compression:
  method: zstd
  level: 10

local:
  enabled: true
  path: /var/backups/backuppy/{{NAME}}
  keep_last: 7

# Uncomment a destination — see files.yml for examples.

verify:
  enabled: true
  method: size

log:
  file: /var/log/backuppy.log
  level: INFO
