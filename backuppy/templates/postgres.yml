# Model: {{NAME}}
# PostgreSQL backup using pg_dump.
# Generated by `backuppy new {{NAME}} --template postgres`

name: {{NAME}}

postgres:
  enabled: true
  host: localhost
  port: 5432
  username: postgres
  password: ""                               # or leave blank to use ~/.pgpass / PGPASSWORD env
  databases: []                              # empty = pg_dumpall (whole cluster + globals)
  # databases: [myapp, otherapp]             # or list specific DBs
  format: custom                             # custom | plain | tar | directory

local:
  path: /var/backups/backuppy/{{NAME}}
  keep_last: 7

# TODO: enable a remote destination (uncomment ONE or more)
#
# s3:
#   enabled: true
#   bucket: my-backups
#   region: eu-central-1
#   prefix: {{NAME}}
#   access_key_id: "AKIA..."
#   secret_access_key: "..."
#   keep_last: 30

compression:
  method: zstd
  level: 10

verify:
  enabled: true
  method: size

log:
  file: /var/log/backuppy.log
  level: INFO
