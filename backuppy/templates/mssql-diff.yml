# Model: {{NAME}}
# MSSQL DIFFERENTIAL backup — small, fast, captures changes since last FULL.
# Run hourly. Always paired with a FULL model running once a day.
# Generated by `backuppy new {{NAME}} --template mssql-diff`

name: {{NAME}}

mssql:
  enabled: true
  host: "WINDOWS-HOST"
  port: 1433
  username: "backup_user"
  password: "CHANGE-ME"
  remote_backup_dir: "D:\\Backups\\backuppy"
  local_mount_dir: "/mnt/mssql-backups"
  compression: true
  checksum: true
  cleanup_remote: true
  databases:
    - { name: AppDB, backup_type: DIFFERENTIAL }   # TODO: list your databases

local:
  path: /var/backups/backuppy/{{NAME}}
  keep_last: 48                              # 48 hourly diffs = 2 days local

# TODO: enable a remote destination (uncomment ONE or more)
#
# s3:
#   enabled: true
#   bucket: my-backups
#   region: eu-central-1
#   prefix: {{NAME}}
#   access_key_id: "AKIA..."
#   secret_access_key: "..."
#   keep_last: 96                            # 4 days on S3
#
# webdav:
#   enabled: true
#   base_url: "https://uXXXXXX.your-storageshare.de/remote.php/dav/files/uXXXXXX/"
#   remote_path: "Backups/{{NAME}}"
#   username: "uXXXXXX"
#   password: "APP-PASSWORD"
#   keep_last: 96

compression:
  method: zstd
  level: 10

verify:
  enabled: true
  method: size

log:
  file: /var/log/backuppy.log
  level: INFO
