# Model: {{NAME}}
# MSSQL DIFFERENTIAL backup — small, fast, captures changes since last FULL.
# Pair with an mssql-full model that runs daily.
# Generated by `backuppy new {{NAME}} --template mssql-diff`

name: {{NAME}}

triggers:
  - type: mssql
    host: "WINDOWS-HOST"
    port: 1433
    username: "backup_user"
    password: "CHANGE-ME"
    output_dir_windows: "D:\\Backups\\backuppy"
    databases:
      - { name: AppDB, backup_type: DIFFERENTIAL }
    compression: true
    checksum: true

sources:
  - type: files
    paths:
      - "/mnt/win-server1/backuppy/*-diff-*.bak"
    delete_after_pickup: false

compression:
  method: zstd
  level: 10

local:
  enabled: true
  path: /var/backups/backuppy/{{NAME}}
  keep_last: 48                                    # 48 hourly diffs = 2 days

# Uncomment a destination — see mssql-full.yml for examples.

verify:
  enabled: true
  method: size

log:
  file: /var/log/backuppy.log
  level: INFO
