# Model: {{NAME}}
# Filesystem backup — picks up files from one or more paths.
# Generated by `backuppy new {{NAME}} --template files`

name: {{NAME}}

# Files to back up. Paths may include glob patterns (*.bak, **/*.log).
# Set archive_name to pack everything into a single tar; omit it to
# upload each file individually.
sources:
  - type: files
    paths:
      - /etc
      - /var/www
    excludes:
      - "*/node_modules/*"
      - "*.tmp"
    archive_name: files            # pack into one tar; omit for individual uploads
    delete_after_pickup: false     # don't delete source files

compression:
  method: zstd
  level: 6

local:
  enabled: true
  path: /var/backups/backuppy/{{NAME}}
  keep_last: 7

# Uncomment ONE or more destinations:
#
# webdav:
#   enabled: true
#   base_url: "https://nextcloud.example.com/remote.php/dav/files/USER/"
#   remote_path: "Backups/{{NAME}}"
#   username: "USER"
#   password: "APP-PASSWORD"
#   keep_last: 30
#
# s3:
#   enabled: true
#   bucket: my-backups
#   region: eu-central-1
#   prefix: {{NAME}}
#   access_key_id: ""
#   secret_access_key: ""
#   keep_last: 30

verify:
  enabled: true
  method: size

log:
  file: /var/log/backuppy.log
  level: INFO
