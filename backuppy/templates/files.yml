# Model: {{NAME}}
# Filesystem archive backup.
# Generated by `backuppy new {{NAME}} --template files`

name: {{NAME}}

archive:
  name: files
  paths:
    - /etc                                   # TODO: list directories to back up
    - /var/www
  excludes:
    - "*/node_modules/*"
    - "*/.cache/*"
    - "*.tmp"

local:
  path: /var/backups/backuppy/{{NAME}}
  keep_last: 7

# TODO: enable a remote destination (uncomment ONE or more)
#
# s3:
#   enabled: true
#   bucket: my-backups
#   region: eu-central-1
#   prefix: {{NAME}}
#   access_key_id: "AKIA..."
#   secret_access_key: "..."
#   keep_last: 30
#
# webdav:
#   enabled: true
#   base_url: "https://uXXXXXX.your-storageshare.de/remote.php/dav/files/uXXXXXX/"
#   remote_path: "Backups/{{NAME}}"
#   username: "uXXXXXX"
#   password: "APP-PASSWORD"
#   keep_last: 30

compression:
  method: zstd
  level: 6                                   # faster, slightly larger than 10

verify:
  enabled: true
  method: size

log:
  file: /var/log/backuppy.log
  level: INFO
