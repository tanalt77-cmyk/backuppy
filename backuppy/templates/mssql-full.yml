# Model: {{NAME}}
# MSSQL FULL backup of databases on a Windows SQL Server.
# Generated by `backuppy new {{NAME}} --template mssql-full`
#
# How this works:
# 1. The mssql trigger connects to Windows SQL Server over TCP/1433 and runs
#    BACKUP DATABASE. SQL Server writes the .bak file(s) to the path you
#    specify in 'output_dir_windows' (Windows-side path).
# 2. The files source picks up those .bak files from a Linux-side path —
#    YOU are responsible for ensuring that path is accessible (SMB mount,
#    NFS, etc). The trigger and source are independent.
#
# Example: SQL Server writes to D:\Backups\backuppy on Windows, and that
# folder is shared and mounted on Linux at /mnt/win-server1/backuppy.

name: {{NAME}}

triggers:
  - type: mssql
    host: "WINDOWS-HOST"                           # TODO: IP or DNS
    port: 1433
    username: "backup_user"                        # TODO: SQL login
    password: "CHANGE-ME"
    output_dir_windows: "D:\\Backups\\backuppy"   # TODO: Windows-side path
    databases:
      - { name: AppDB, backup_type: FULL }         # TODO: list your databases
      # - { name: OtherDB, backup_type: FULL }
    compression: true                              # MSSQL native compression in .bak
    checksum: true
    copy_only: false                               # true to not affect log chain

sources:
  - type: files
    paths:
      - "/mnt/win-server1/backuppy/*.bak"          # TODO: Linux path where .bak appears
    delete_after_pickup: false                     # keep .bak on Windows-side as well

compression:
  method: zstd                                     # final on-disk compression
  level: 10

local:
  enabled: true
  path: /var/backups/backuppy/{{NAME}}
  keep_last: 7

# Uncomment ONE or more destinations:
#
# webdav:
#   enabled: true
#   base_url: "https://nextcloud.example.com/remote.php/dav/files/USER/"
#   remote_path: "Backups/{{NAME}}"
#   username: "USER"
#   password: "APP-PASSWORD"
#   keep_last: 30
#
# s3:
#   enabled: true
#   bucket: my-backups
#   region: eu-central-1
#   prefix: {{NAME}}
#   access_key_id: ""
#   secret_access_key: ""
#   keep_last: 30

verify:
  enabled: true
  method: size

log:
  file: /var/log/backuppy.log
  level: INFO
