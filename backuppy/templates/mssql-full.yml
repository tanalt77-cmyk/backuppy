# Model: {{NAME}}
# MSSQL FULL backup of databases on a Windows server.
# Generated by `backuppy new {{NAME}} --template mssql-full`

name: {{NAME}}

mssql:
  enabled: true
  host: "WINDOWS-HOST"                       # TODO: IP or DNS of SQL Server
  port: 1433
  username: "backup_user"                    # TODO: SQL login with BACKUP DATABASE rights
  password: "CHANGE-ME"
  remote_backup_dir: "D:\\Backups\\backuppy" # TODO: Windows path SQL Server writes .bak to
  local_mount_dir: "/mnt/mssql-backups"      # TODO: SMB mount of the same dir on this Linux box
  compression: true
  checksum: true
  cleanup_remote: true                       # delete .bak from Windows after Linux picks it up
  databases:
    - { name: AppDB, backup_type: FULL }     # TODO: list your databases here

# Where to store backups locally before uploading
local:
  path: /var/backups/backuppy/{{NAME}}
  keep_last: 7                               # keep 7 local FULL backups

# TODO: enable a remote destination (uncomment ONE or more)
#
# s3:
#   enabled: true
#   bucket: my-backups
#   region: eu-central-1
#   prefix: {{NAME}}
#   access_key_id: "AKIA..."
#   secret_access_key: "..."
#   keep_last: 30
#
# webdav:
#   enabled: true
#   base_url: "https://uXXXXXX.your-storageshare.de/remote.php/dav/files/uXXXXXX/"
#   remote_path: "Backups/{{NAME}}"
#   username: "uXXXXXX"
#   password: "APP-PASSWORD"
#   keep_last: 30

compression:
  method: zstd                               # fast and tight
  level: 10

verify:
  enabled: true
  method: size

log:
  file: /var/log/backuppy.log
  level: INFO
