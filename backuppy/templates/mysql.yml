# Model: {{NAME}}
# MySQL/MariaDB backup using mysqldump.
# Generated by `backuppy new {{NAME}} --template mysql`

name: {{NAME}}

triggers:
  - type: mysql
    host: localhost
    port: 3306
    username: root
    password: "CHANGE-ME"
    output_dir: /tmp/backuppy-{{NAME}}
    databases: []                        # [] = --all-databases
    # databases: [appdb, otherdb]
    single_transaction: true
    routines: true
    triggers: true
    events: true

sources:
  - type: files
    paths:
      - "/tmp/backuppy-{{NAME}}/*"
    delete_after_pickup: true

compression:
  method: zstd
  level: 10

local:
  enabled: true
  path: /var/backups/backuppy/{{NAME}}
  keep_last: 7

verify:
  enabled: true
  method: size

log:
  file: /var/log/backuppy.log
  level: INFO
