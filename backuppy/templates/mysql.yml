# Model: {{NAME}}
# MySQL/MariaDB backup using mysqldump.
# Generated by `backuppy new {{NAME}} --template mysql`

name: {{NAME}}

mysql:
  enabled: true
  host: localhost
  port: 3306
  username: root
  password: "CHANGE-ME"
  databases: []                              # empty = --all-databases
  # databases: [appdb, otherdb]              # or list specific DBs
  single_transaction: true                   # safe online dump for InnoDB
  routines: true
  triggers: true
  events: true

local:
  path: /var/backups/backuppy/{{NAME}}
  keep_last: 7

# TODO: enable a remote destination (uncomment ONE or more)
#
# s3:
#   enabled: true
#   bucket: my-backups
#   region: eu-central-1
#   prefix: {{NAME}}
#   access_key_id: "AKIA..."
#   secret_access_key: "..."
#   keep_last: 30

compression:
  method: zstd
  level: 10

verify:
  enabled: true
  method: size

log:
  file: /var/log/backuppy.log
  level: INFO
